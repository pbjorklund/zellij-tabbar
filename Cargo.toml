[package]
name = "zellij-tabbar"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A configurable vertical tab bar plugin for Zellij"
license = "MIT"
repository = "https://github.com/pbjorklund/zellij-tabbar"
keywords = ["zellij", "terminal", "wasm", "tabs"]
categories = ["command-line-utilities", "wasm"]

[workspace]
members = ["activity"]

[[bench]]
name = "plugin"
harness = false

[dependencies]
zellij-tile = { git = "https://github.com/pbjorklund/zellij", rev = "8de130b8a4cf4d894303904510dfa4db55cc8d39", version = "=0.46.0" }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
activity = { path = "activity" }
